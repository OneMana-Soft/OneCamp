version: "3.8"

services:
  turn:
    # Not deployed on any current host, so there is no running version to preserve;
    # this is the newest published stable.
    image: coturn/coturn:4.17.2
    container_name: turn
    restart: unless-stopped
    ports:
      - "3478:3478" # TURN server port
      - "3478:3478/udp" # TURN server UDP port
    environment:
      - TURN_SECRET=${TURN_SECRET} # Replace with your shared secret
      - TURN_REALM=${TURN_DOMAIN} # Replace with your domain
    command: |
      --no-tls
      --no-dtls
      --lt-cred-mech
      --realm=yourdomain.com
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --log-file=stdout
