<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneCamp tasks</title>
<style>
  /* The host's own variables (MCP Apps theming) win; these are the fallback,
     OneCamp's ink-on-paper with its one orange accent. */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1a1917));
    --fg: var(--color-text-primary, light-dark(#1d1b19, #f5f3f0));
    --muted: var(--color-text-secondary, light-dark(#6b645d, #a8a19a));
    --line: var(--color-border-secondary, light-dark(#e7e3de, #2f2c29));
    --danger: var(--color-text-danger, light-dark(#c2410c, #fb923c));
    --accent: light-dark(#c84f00, #f0a060);
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
  header { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 6px; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  header .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  header .brand { margin-left: auto; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  ul { list-style: none; margin: 0; padding: 0 6px 8px; }
  li a { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px; border-radius: 8px;
         color: inherit; text-decoration: none; border-top: 1px solid var(--line); }
  li:first-child a { border-top-color: transparent; }
  li a:hover { background: color-mix(in oklab, var(--fg) 5%, transparent); }
  li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .done .name { color: var(--muted); text-decoration: line-through; }
  .due { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .overdue .due { color: var(--danger); font-weight: 500; }
  .meta { grid-column: 1 / -1; color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
  .empty, .note { padding: 6px 14px 14px; color: var(--muted); }
</style>
</head>
<body>
<header><h1 id="title">Tasks</h1><span class="count" id="count"></span><span class="brand">OneCamp</span></header>
<ul id="list"></ul>
<p class="note" id="note" hidden></p>
<script>
(function () {
  "use strict";
  var nextId = 1, pending = {};

  function send(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    var id = nextId++;
    send({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    return new Promise(function (resolve, reject) { pending[id] = { resolve: resolve, reject: reject }; });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params || {} }); }

  function applyStyles(ctx) {
    var vars = ctx && ctx.styles && ctx.styles.variables;
    if (!vars) return;
    Object.keys(vars).forEach(function (k) { if (vars[k]) document.documentElement.style.setProperty(k, vars[k]); });
    if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
  }

  // The rows: structuredContent.data (this server's convention), or the raw
  // structured_json the governed path also carries under meta.
  function rowsFrom(result) {
    var sc = result && result.structuredContent;
    if (!sc) return null;
    if (sc.data && sc.data.tasks) return sc.data;
    if (sc.tasks) return sc;
    try { if (sc.meta && sc.meta.structured_json) return JSON.parse(sc.meta.structured_json); } catch (e) {}
    return null;
  }

  function dueText(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var day = new Date(d); day.setHours(0, 0, 0, 0);
    var diff = Math.round((day - today) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    if (diff === -1) return "Yesterday";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  var STATUS = { backlog: "Backlog", todo: "To do", inProgress: "In progress", inReview: "In review", done: "Done", canceled: "Canceled" };
  function statusText(s) { return STATUS[s] || s || "No status"; }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  function render(data, fallbackText) {
    var list = document.getElementById("list"), note = document.getElementById("note");
    list.textContent = "";
    note.hidden = true;
    if (!data) {
      document.getElementById("title").textContent = "Tasks";
      note.textContent = fallbackText || "Nothing to show.";
      note.hidden = false;
      return resize();
    }
    document.getElementById("title").textContent = data.title || "Tasks";
    var tasks = data.tasks || [];
    document.getElementById("count").textContent = tasks.length < data.total ? tasks.length + " of " + data.total : String(tasks.length);
    if (tasks.length === 0) { note.textContent = "No tasks match."; note.hidden = false; }
    tasks.forEach(function (t) {
      var li = el("li", (t.overdue ? "overdue " : "") + (t.status === "done" || t.status === "canceled" ? "done" : ""));
      var a = el("a"); a.href = t.url; a.title = "Open in OneCamp";
      a.appendChild(el("span", "name", t.name));
      a.appendChild(el("span", "due", t.due ? (t.overdue ? "Was due " : "") + dueText(t.due) : ""));
      var meta = el("span", "meta");
      meta.appendChild(el("span", "pill", statusText(t.status)));
      if (t.priority) meta.appendChild(el("span", null, t.priority + " priority"));
      if (t.project) meta.appendChild(el("span", null, t.project));
      if (t.assignee) meta.appendChild(el("span", null, t.assignee));
      a.appendChild(meta);
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        request("ui/open-link", { url: t.url }).catch(function () { window.open(t.url, "_blank", "noopener"); });
      });
      li.appendChild(a);
      list.appendChild(li);
    });
    resize();
  }

  function resize() {
    // The content's height, not the frame's: the document is at least as tall
    // as the frame, so measuring it would never let the host shrink the view.
    var r = document.body.getBoundingClientRect();
    notify("ui/notifications/size-changed", { width: Math.ceil(r.width), height: Math.ceil(r.height) });
  }

  window.addEventListener("message", function (ev) {
    var m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending[m.id]) {
      var p = pending[m.id]; delete pending[m.id];
      if (m.error) p.reject(m.error); else p.resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") {
      var text = (m.params && m.params.content || []).map(function (c) { return c.text || ""; }).join("\n");
      render(rowsFrom(m.params), m.params && m.params.isError ? text : text || null);
    } else if (m.method === "ui/notifications/host-context-changed") {
      applyStyles(m.params);
    } else if (m.method === "ui/resource-teardown" && m.id !== undefined) {
      send({ jsonrpc: "2.0", id: m.id, result: {} });
    }
  });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "OneCamp tasks", version: "1.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] }
  }).then(function (res) {
    applyStyles(res && res.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(function () { notify("ui/notifications/initialized", {}); });
})();
</script>
</body>
</html>
