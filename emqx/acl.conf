%% ─── OneCamp EMQX authorisation ACL ──────────────────────────────────
%%
%% Subscriptions are denied by default. Each rule below grants a
%% specific username pattern access to a specific topic prefix.
%%
%% Topic prefixes are produced by helpers/helpers.go and follow these
%% conventions:
%%
%%   message/<base32>   — channel / DM / group chat / project messages
%%   typing/<base32>    — channel / DM / group chat typing indicators
%%   activity/<base32>  — per-user notification feed
%%   doc/<base32>       — collaborative doc events
%%   admin/<base32>     — system-admin broadcast (archive jobs etc)
%%   public/<topic>     — public broadcast (e.g. public/userStatus)
%%
%% IMPORTANT: this file is mounted into the EMQX container via
%% emqx-compose.yml. Edits take effect on container restart. If you
%% add a new topic prefix in helpers.go you MUST also add it to the
%% subscribe allow-list below or end users will get
%% "Subscribe error: Not authorized" from the broker.

%% Dashboard user can read system topics.
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

%% Backend service publishes everything; full access.
{allow, {username, "backend"}, all, ["#", "$SYS/#"]}.

%% Authenticated end users (username pattern: user_<uuid>) may
%% subscribe to the OneCamp topic prefixes. They may NOT publish — the
%% backend mediates all writes to ensure permissions and persistence.
{allow, {username, {re, "^user_.*$"}}, subscribe, [
    "message/#",
    "typing/#",
    "public/#",
    "activity/#",
    "doc/#",
    "admin/#"
]}.

%% Catch-all deny.
{deny, all}.
