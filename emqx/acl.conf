%% ─── OneCamp EMQX authorisation ACL ──────────────────────────────────
%%
%% The broker checks a request against this file first, then asks the
%% backend (the HTTP source in the compose files, POST
%% http://go-service:3000/internal/mqtt/authorize). Anything neither
%% allows is denied (EMQX_AUTHORIZATION__NO_MATCH: deny).
%%
%% People (usernames user_<uuid>) are answered by the backend, which
%% allows a subscription only to a topic of something that person can
%% read: a channel, conversation or project they're in, a doc, board or
%% table they can open, their own notifications, who's online, and, for
%% admins, the admin broadcast (business/MqttAccess). This file used to
%% let every person subscribe under message/, typing/, activity/, doc/,
%% admin/ and public/, wildcards included, so "message/#" read every
%% channel and conversation in the workspace.
%%
%% This file is mounted into the EMQX container by the compose files.
%% Edits take effect on container restart.

%% Dashboard user can read system topics.
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

%% Backend service publishes everything; full access.
{allow, {username, "backend"}, all, ["#", "$SYS/#"]}.

%% People never publish: what they send goes through the API, which
%% checks it and publishes as the backend. Refused here, without asking.
{deny, {username, {re, "^user_"}}, publish, ["#", "$SYS/#"]}.

%% Nothing else is decided here: a person's subscription goes on to the
%% backend. (A catch-all deny here would refuse it before that.)
