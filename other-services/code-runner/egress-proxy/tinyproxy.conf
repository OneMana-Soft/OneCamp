# tinyproxy.conf — the egress allowlist for the CODE-PR coding runner.
#
# The coding runner has NO direct internet route (it sits on an internal-only
# Docker network). Its git clone/push traffic is forced through THIS proxy via
# HTTPS_PROXY. The proxy is DEFAULT-DENY and only permits the git host(s) in
# filter-allowlist.txt — so untrusted code executing in the runner cannot reach
# anything except the repository host, even if it tries.
#
# Verify with the smoke target (make code-runner-coding-smoke): a request to a
# non-allowlisted host MUST be refused, and the git host MUST succeed.

# NB: no User/Group privilege-drop here — tinyproxy would try setgid/setuid and
# crash-loop ("Unable to change to group") when it isn't started as root or the
# group is absent in this image. The CONTAINER already runs locked down
# (cap_drop ALL, no-new-privileges) in code-runner-coding-compose.yml, so the
# proxy doesn't need to drop privileges itself.
Port 8888

# Listen only on the container network; never expose the proxy publicly.
Listen 0.0.0.0
Timeout 600

# ── Default-deny allowlist ────────────────────────────────────────────────
# FilterDefaultDeny On => only hosts matching an entry in the filter file are
# allowed; everything else is blocked. Filter matches the CONNECT host for
# HTTPS (git uses CONNECT), so this governs clone/push egress.
Filter "/etc/tinyproxy/filter-allowlist.txt"
FilterDefaultDeny On
FilterExtended On
FilterCaseSensitive Off

# Allow the HTTPS CONNECT method to the git host's TLS port only. (Plain-HTTP
# proxying is not needed; git-over-https uses CONNECT.)
ConnectPort 443

# Keep logs minimal + non-sensitive; never log request bodies.
LogLevel Warning
DisableViaHeader Yes
