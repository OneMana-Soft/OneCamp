# Secret scan for the public export. The default rules apply; only the
# deliberate fakes below are allowed: test fixtures (placeholder keys such as
# "-----BEGIN PRIVATE KEY-----\nQUJD") and CI's throwaway encryption keys.
[extend]
useDefault = true

[allowlist]
description = "fixtures and CI throwaway values"
paths = [
  '''_test\.go$''',
  '''\.test\.js$''',
  '''(^|/)tests/integration/''',
  '''(^|/)\.github/workflows/ci\.yml$''',
  # curl -u "admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}": a variable, not a password.
  '''(^|/)other-services/opensearch/snapshot\.sh$''',
]
